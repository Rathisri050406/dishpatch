<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dishpatch – Food delivery, dispatched fast</title>
<meta name="description" content="Order from the best local restaurants and track your food live.">
<style>:root{--ink:#14161f;--mut:#667085;--bg:#fff;--soft:#f4f5f7;--line:#e4e7ec;--acc:#ff5a1f;--acc2:#1d1b3a;--ok:#16a34a}
@media(prefers-color-scheme:dark){:root{--ink:#f2f4f7;--mut:#98a2b3;--bg:#0f1117;--soft:#1a1d27;--line:#2a2f3d;--acc2:#2c2a5a}}
*{box-sizing:border-box}body{margin:0;font:15px/1.45 system-ui,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink)}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit;border-radius:999px}:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
header{position:sticky;top:0;z-index:5;display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px 4vw;background:var(--bg);border-bottom:1px solid var(--line)}
.logo{display:flex;align-items:center;gap:8px;font:800 22px system-ui;letter-spacing:-.5px;margin-right:6px}
.logo i{display:grid;place-items:center;width:32px;height:32px;border-radius:10px;background:var(--acc);color:#fff;font-style:normal}
header input{padding:10px 14px;border-radius:999px;border:0;background:var(--soft);color:var(--ink);font:inherit}
#q{flex:1 1 200px}.loc{flex:0 1 220px}
.mode{display:flex;background:var(--soft);border-radius:999px;padding:3px}.mode button{padding:7px 14px}.mode [aria-pressed=true]{background:var(--ink);color:var(--bg)}
.cartbtn{background:var(--acc);color:#fff;padding:9px 16px;font-weight:700}
.shell{display:flex;gap:24px;max-width:1280px;margin:auto;padding:16px 4vw}
.side{display:none;flex-direction:column;gap:4px;width:170px;flex:none;position:sticky;top:76px;align-self:flex-start}
.side button{text-align:left;padding:10px 14px;border-radius:12px;font-weight:600}.side button:hover,.side [aria-pressed=true]{background:var(--soft)}.side [aria-pressed=true]{color:var(--acc)}
@media(min-width:900px){.side{display:flex}}
.content{flex:1;min-width:0}
.promos{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px;margin-bottom:18px}
.pc{position:relative;height:120px;overflow:hidden;border-radius:18px;text-align:left;background:var(--acc2)}
.pc img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.pc span{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:flex-end;padding:12px 16px;color:#fff;background:linear-gradient(90deg,#000b,#0000 75%)}.pc b{font-size:20px}
.cats{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;scrollbar-width:thin}
.cat{flex:none;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:74px;padding:8px 6px;border-radius:14px;font-size:13px;font-weight:600;border-bottom:3px solid transparent}
.cat span{font-size:32px}.cat:hover{background:var(--soft)}.cat[aria-pressed=true]{border-color:var(--acc);color:var(--acc)}
.pills{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.pill{padding:8px 16px;background:var(--soft);font-weight:600}.pill[aria-pressed=true]{background:var(--ink);color:var(--bg)}
select{margin-left:auto;padding:8px 12px;border-radius:999px;border:0;background:var(--soft);color:var(--ink);font:inherit}
.rh{display:flex;align-items:center;gap:14px;margin:6px 0 14px}.rh b{font-size:17px}.fd{color:var(--acc);font-weight:600;flex:1}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:22px 18px}
.card{text-align:left;border-radius:16px;display:block}
.ph{position:relative;aspect-ratio:3/2;overflow:hidden;border-radius:16px;background:var(--soft)}
.ph img,.cov{width:100%;height:100%;object-fit:cover;display:block;transition:transform .3s}.card:hover img{transform:scale(1.06)}
.tagp{position:absolute;left:10px;bottom:10px;background:var(--acc);color:#fff;font-weight:800;font-size:12px;padding:3px 9px;border-radius:6px}
.ci{padding:8px 2px}.row{display:flex;justify-content:space-between;align-items:center;gap:8px}.row b{font-size:16px}
.meta{color:var(--mut);font-size:13px}.rate{background:var(--soft);padding:1px 8px;border-radius:999px;font-size:13px;font-weight:700}
.vt{color:var(--ok);font-weight:700}.empty{grid-column:1/-1;text-align:center;color:var(--mut)}
.veg{display:inline-block;width:12px;height:12px;border:2px solid var(--ok);position:relative;margin-right:6px}
.veg:after{content:"";position:absolute;inset:2px;border-radius:50%;background:var(--ok)}.veg.n{border-color:#d92d20}.veg.n:after{background:#d92d20}
aside{position:fixed;top:0;right:0;height:100%;width:min(440px,100%);background:var(--bg);box-shadow:-10px 0 40px #0006;transform:translateX(105%);transition:transform .25s;z-index:10;display:flex;flex-direction:column}
aside.open{transform:none}.hd{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line);font-size:17px}
.x{font-size:20px;padding:4px 10px}.bd{flex:1;overflow:auto;padding:12px 16px}.ft{padding:14px 16px;border-top:1px solid var(--line)}
.cov{height:170px;border-radius:16px;margin-bottom:10px}h2{margin:4px 0}
.promo{display:inline-block;margin:8px 0;background:#ff5a1f1f;color:var(--acc);font-weight:700;padding:3px 10px;border-radius:6px;font-size:13px}
.item{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}.item img{width:78px;height:78px;border-radius:12px;object-fit:cover}.nm{flex:1}
.add,.qty button{background:var(--ink);color:var(--bg);padding:6px 16px;font-weight:700}.qty{display:flex;gap:8px;align-items:center}.qty button{padding:2px 11px}
.ft input,.ft select{width:100%;padding:10px 12px;margin:0 0 8px;border-radius:12px;border:1px solid var(--line);background:var(--soft);color:var(--ink);font:inherit}
.pay{width:100%;background:var(--acc);color:#fff;padding:13px;font-weight:700;font-size:16px}.pay:disabled{opacity:.5}
.ok{color:var(--ok)}.steps{list-style:none;margin:18px 0;padding:0}.steps li{padding:10px 0 10px 34px;position:relative;color:var(--mut)}
.steps li:before{content:"";position:absolute;left:6px;top:14px;width:14px;height:14px;border-radius:50%;border:2px solid var(--line)}
.steps li.on{color:var(--ink);font-weight:700}.steps li.on:before{background:var(--acc);border-color:var(--acc)}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 20px;border-radius:12px;display:none;z-index:20}
footer{text-align:center;color:var(--mut);padding:24px;font-size:13px}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head>

function bill(){const ks=Object.keys(S.cart);if(!ks.length)return null;const r=info(ks[0]).r,sub=ks.reduce((s,k)=>s+info(k).d[1]*S.cart[k],0);
 const disc=r.p&&sub>=r.p[2]?Math.min(r.p[1],Math.round(sub*r.p[0]/100)):0,tax=Math.round((sub-disc)*.05),f=fee(r);return{ks,r,sub,disc,tax,f,total:sub-disc+tax+f}}

function list(){const q=$("#q").value.trim().toLowerCase(),low=r=>Math.min(...r.m.map(m=>m[1]));
 const a=R.filter(r=>(S.cat=="All"||(S.cat=="Trending"?r.r>=4.4:r.c==S.cat))&&(!S.veg||r.veg)&&(!S.off||r.p)&&(!S.top||r.r>=4.3)&&(!S.fast||r.t<30)&&(!S.free||fee(r)==0)&&(!q||(r.n+r.c+r.m.map(x=>x[0]).join()).toLowerCase().includes(q)))
  .sort((x,y)=>S.sort=="time"?x.t-y.t:S.sort=="price"?low(x)-low(y):y.r-x.r);
 $("#count").textContent=a.length+(a.length==1?" restaurant":" restaurants");
 $("#grid").innerHTML=a.map(card).join("")||`<p class="empty">No restaurants match. <button class="pill" data-reset>Reset filters</button></p>`}

 $("#so").value=S.sort;$$(".side [data-n]").forEach(b=>b.setAttribute("aria-pressed",!!S[b.dataset.n]));

 const b=bill(),f=S.f,pk=S.mode=="pickup";
 c.innerHTML=hd("Your cart")+`<div class="bd">${b?`<div class="meta">From ${b.r.n} · ${pk?"Pickup":"Delivery"}</div>`+b.ks.map(k=>`<div class="item"><div class="nm">${info(k).d[0]}<div class="meta">₹${info(k).d[1]}</div></div><div class="qty"><button data-q="${k}" data-s="-1" aria-label="Fewer">−</button>${S.cart[k]}<button data-q="${k}" data-s="1" aria-label="More">+</button></div></div>`).join(""):"<p>Your cart is empty. Pick a restaurant and add a dish.</p>"}</div>`+
 `<div class="ft">${b?`<div class="row"><span>Items</span><span>₹${b.sub}</span></div>${b.disc?`<div class="row ok"><span>Offer</span><span>−₹${b.disc}</span></div>`:b.r.p?`<div class="row meta"><span>${promo(b.r)}</span></div>`:""}<div class="row"><span>${pk?"Pickup":"Delivery"}</span><span>₹${b.f}</span></div><div class="row"><span>GST (5%)</span><span>₹${b.tax}</span></div><div class="row"><b>To pay</b><b>₹${b.total}</b></div><br>
 <input id="nm" placeholder="Your name" autocomplete="name" value="${f.nm||""}"><input id="ph" placeholder="Phone (10 digits)" inputmode="tel" autocomplete="tel" value="${f.ph||""}">${pk?"":`<input id="ad" placeholder="Delivery address" autocomplete="street-address" value="${f.ad??$("#loc").value}">`}
 <select id="py"><option value="Online"${f.py=="Online"?" selected":""}>Pay online</option><option value="Cash"${f.py=="Cash"?" selected":""}>${pk?"Pay at pickup":"Cash on delivery"}</option></select><button class="pay" id="pay">Place order · ₹${b.total}</button>`:""}</div>`}
async function place(){const b=bill(),nm=$("#nm").value.trim(),ph=$("#ph").value.trim(),ad=S.mode=="pickup"?"Pickup":($("#ad").value||"").trim();
 if(!nm||!/^\d{10}$/.test(ph)||!ad)return toast("Enter your name, a 10-digit phone number"+(S.mode=="pickup"?"":" and an address"));
 const o={restaurant:b.r.n,mode:S.mode,payment:$("#py").value,items:b.ks.map(k=>({name:info(k).d[0],price:info(k).d[1],qty:S.cart[k]})),discount:b.disc,total:b.total,customer:{name:nm,phone:ph,address:ad}};
 $("#pay").disabled=true;let id="DP"+Date.now().toString().slice(-6);
 try{if(API_URL){const r=await fetch(API_URL+"/orders",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(o)});if(!r.ok)throw 0;id=(await r.json()).orderId}
  S.track={id,restaurant:o.restaurant,total:o.total,mode:S.mode,at:Date.now()};S.step=0;S.cart={};S.f={};upd();clearInterval(timer);timer=setInterval(poll,4000)}
 catch(e){toast("Could not place the order. Check your connection and try again.");$("#pay").disabled=false}}
async function poll(){const t=S.track;if(!t)return;try{S.step=API_URL?(await(await fetch(API_URL+"/orders/"+t.id)).json()).step:Math.min(3,Math.floor((Date.now()-t.at)/25000))}catch(e){}cartUI();if(S.step>=3)clearInterval(timer)}
function nav(n){if(n=="home")reset();else if(n=="order"){cartUI();$("#cart").classList.add("open")}else{S[n]=S[n]?0:1;ui()}}
document.addEventListener("click",e=>{const t=e.target.closest("button");if(!t)return;const d=t.dataset;
 if(d.c){S.cat=d.c;ui()}else if(d.f){S[d.f]=S[d.f]?0:1;ui()}else if(d.n)nav(d.n);else if(d.m){S.mode=d.m;ui();cartUI()}
 else if("reset" in d)reset();else if(d.r)openRest(d.r);else if(d.add)add(+d.add);else if(d.close)$("#"+d.close).classList.remove("open");
 else if(d.q){S.cart[d.q]+=+d.s;if(S.cart[d.q]<1)delete S.cart[d.q];upd()}else if("new" in d){S.track=null;cartUI()}
 else if(t.id=="cartbtn"){cartUI();$("#cart").classList.add("open")}else if(t.id=="pay")place()});
document.addEventListener("change",e=>{if(e.target.id=="so"){S.sort=e.target.value;list()}});
document.addEventListener("input",e=>{const k={nm:"nm",ph:"ph",ad:"ad",py:"py"}[e.target.id];if(k)S.f[k]=e.target.value;if(e.target.id=="q")list()});
ui();cartUI();

</script>
</body></html>
